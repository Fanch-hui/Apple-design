<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>动迹 / 页面预览</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      color: #22201e;
      background: #f6f5f2;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1440px; margin: 0 auto; padding: 64px 40px 80px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 42px; }
    .eyebrow { margin: 0 0 8px; color: #c94c23; font-size: 14px; font-weight: 600; letter-spacing: .05em; }
    h1 { margin: 0; font-size: clamp(28px, 3vw, 40px); font-weight: 650; letter-spacing: -.04em; }
    header p:last-child { margin: 0 0 4px; color: #77736e; font-size: 14px; }
    .gallery { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px 24px; }
    figure { min-width: 0; margin: 0; }
    .screen {
      display: block; width: 100%; padding: 0; overflow: hidden; border: 0; border-radius: 24px;
      background: #e8e6e1; box-shadow: 0 8px 26px rgba(40, 31, 20, .09);
      cursor: zoom-in; transition: box-shadow .2s ease, transform .2s ease;
    }
    .screen:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(40, 31, 20, .14); }
    .screen:focus-visible, .close:focus-visible { outline: 3px solid #cf4d24; outline-offset: 4px; }
    .screen img { display: block; width: 100%; height: auto; }
    figcaption { display: flex; align-items: baseline; gap: 10px; padding: 16px 2px 0; }
    .number { color: #a49e96; font-size: 12px; font-variant-numeric: tabular-nums; }
    .label { font-size: 15px; font-weight: 600; }
    dialog {
      width: min(100% - 32px, 620px); max-height: calc(100dvh - 32px); padding: 20px;
      border: 0; border-radius: 24px; background: #fff; color: #22201e;
      box-shadow: 0 24px 70px rgba(18, 15, 12, .25);
    }
    dialog::backdrop { background: rgba(20, 18, 16, .72); }
    .dialog-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .dialog-heading h2 { margin: 0; font-size: 17px; font-weight: 600; }
    .close {
      display: grid; width: 36px; height: 36px; padding: 0; place-items: center;
      border: 0; border-radius: 50%; background: #f0efed; color: #4b4844;
      font: inherit; font-size: 24px; line-height: 1; cursor: pointer;
    }
    .dialog-image { display: block; width: auto; height: auto; max-width: 100%; max-height: calc(100dvh - 132px); margin: auto; }
    @media (max-width: 1050px) { .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 740px) {
      main { padding: 44px 24px 60px; }
      header { display: block; margin-bottom: 30px; }
      header p:last-child { margin-top: 14px; }
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 16px; }
      .screen { border-radius: 19px; }
    }
    @media (max-width: 420px) {
      main { padding-inline: 20px; }
      .gallery { gap: 28px 12px; }
      .screen { border-radius: 15px; }
      figcaption { gap: 6px; }
      .label { font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) { .screen { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">动迹</p>
        <h1>页面预览</h1>
      </div>
      <p>点击图片可放大查看</p>
    </header>
    <div class="gallery">
      <figure>
        <button class="screen" type="button" data-title="今日" aria-label="放大查看今日页面"><img src="Today.png" alt="今日页面"></button>
        <figcaption><span class="number">01</span><span class="label">今日</span></figcaption>
      </figure>
      <figure>
        <button class="screen" type="button" data-title="记录" aria-label="放大查看记录页面"><img src="History.png" alt="记录页面" loading="lazy"></button>
        <figcaption><span class="number">02</span><span class="label">记录</span></figcaption>
      </figure>
      <figure>
        <button class="screen" type="button" data-title="运动详情" aria-label="放大查看运动详情页面"><img src="Detail.png" alt="运动详情页面" loading="lazy"></button>
        <figcaption><span class="number">03</span><span class="label">运动详情</span></figcaption>
      </figure>
      <figure>
        <button class="screen" type="button" data-title="趋势" aria-label="放大查看趋势页面"><img src="Trends.png" alt="趋势页面" loading="lazy"></button>
        <figcaption><span class="number">04</span><span class="label">趋势</span></figcaption>
      </figure>
      <figure>
        <button class="screen" type="button" data-title="运动计时" aria-label="放大查看运动计时页面"><img src="Session.png" alt="运动计时页面" loading="lazy"></button>
        <figcaption><span class="number">05</span><span class="label">运动计时</span></figcaption>
      </figure>
      <figure>
        <button class="screen" type="button" data-title="添加记录" aria-label="放大查看添加记录页面"><img src="Add.png" alt="添加记录页面" loading="lazy"></button>
        <figcaption><span class="number">06</span><span class="label">添加记录</span></figcaption>
      </figure>
      <figure>
        <button class="screen" type="button" data-title="个人与设置" aria-label="放大查看个人与设置页面"><img src="Settings.png" alt="个人与设置页面" loading="lazy"></button>
        <figcaption><span class="number">07</span><span class="label">个人与设置</span></figcaption>
      </figure>
      <figure>
        <button class="screen" type="button" data-title="今日 · 深色" aria-label="放大查看深色模式的今日页面"><img src="Today-Dark.png" alt="深色模式的今日页面" loading="lazy"></button>
        <figcaption><span class="number">08</span><span class="label">今日 · 深色</span></figcaption>
      </figure>
    </div>
  </main>
  <dialog aria-labelledby="preview-title">
    <div class="dialog-heading">
      <h2 id="preview-title"></h2>
      <button class="close" type="button" aria-label="关闭预览">×</button>
    </div>
    <img class="dialog-image" alt="">
  </dialog>
  <script>
    const dialog = document.querySelector('dialog');
    const title = document.querySelector('#preview-title');
    const enlargedImage = document.querySelector('.dialog-image');

    document.querySelectorAll('.screen').forEach((button) => {
      button.addEventListener('click', () => {
        const image = button.querySelector('img');
        title.textContent = button.dataset.title;
        enlargedImage.src = image.src;
        enlargedImage.alt = image.alt;
        dialog.showModal();
      });
    });
    document.querySelector('.close').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', (event) => {
      if (event.target === dialog) dialog.close();
    });
  </script>
</body>
</html>
